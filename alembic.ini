[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration file names
# %(rev)s   — revision id
# %(slug)s  — slugified revision message
# %(epoch)s — epoch timestamp
file_template = %%(epoch)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Max length of slug in file name
truncate_slug_length = 40

# Set to 'true' to run the environment during migrations
revision_environment = false

# Set to 'true' to allow .pyc migration files
sourceless = false

# Version locations — where Alembic looks for migration scripts
version_locations = %(here)s/alembic/versions

# Prepend sys.path with this path on startup
prepend_sys_path = .

# The SQLAlchemy connection URL is set dynamically in alembic/env.py
# from the DATABASE_URL environment variable — do not set it here
sqlalchemy.url =

[post_write_hooks]
# Runs ruff formatter on new migration files automatically
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S