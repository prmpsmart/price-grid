<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="PriceGrid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3a27"/>
      <stop offset="1" stop-color="#0b170f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2E3C8"/>
      <stop offset="1" stop-color="#698474"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#F6E6CB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F6E6CB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#B6C7AA" stroke-opacity="0.25" stroke-width="2"/>
  <!-- the grid -->
  <g stroke="#B6C7AA" stroke-opacity="0.16" stroke-width="1.5">
    <path d="M24 44H104M24 68H104M24 92H104"/>
  </g>
  <!-- price bars, one per market -->
  <g fill="url(#bar)">
    <rect x="26" y="74" width="16" height="30" rx="4"/>
    <rect x="50" y="58" width="16" height="46" rx="4"/>
    <rect x="74" y="66" width="16" height="38" rx="4"/>
  </g>
  <!-- the spike -->
  <rect x="94" y="32" width="16" height="72" rx="4" fill="#F6E6CB"/>
  <path d="M26 66L50 50L74 58L102 26" fill="none" stroke="#F6E6CB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <circle cx="102" cy="26" r="6" fill="#0b170f" stroke="#F6E6CB" stroke-width="3.5"/>
</svg>
