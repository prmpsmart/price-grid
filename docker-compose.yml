services:

  # ── API ───────────────────────────────────────────────────────────────────
  pricegrid-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: pricegrid-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pricegrid:pricegrid@pricegrid-db:5432/pricegrid
      REDIS_URL: redis://pricegrid-cache:6379
      TEST_DATABASE_URL: postgresql+asyncpg://pricegrid:pricegrid@pricegrid-db-test:5432/pricegrid_test
    depends_on:
      pricegrid-db:
        condition: service_healthy
      pricegrid-cache:
        condition: service_healthy
      pricegrid-db-test:
        condition: service_healthy
        required: false
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic 
      - ./tests:/app/tests 
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - pricegrid-net

  # ── DATABASE ──────────────────────────────────────────────────────────────
  pricegrid-db:
    image: postgres:15-alpine
    container_name: pricegrid-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pricegrid
      POSTGRES_PASSWORD: pricegrid
      POSTGRES_DB: pricegrid
    ports:
      - "5432:5432"             # exposed for local DB tools (TablePlus, DBeaver)
    volumes:
      - pricegrid-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricegrid -d pricegrid"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pricegrid-net

  # ── TEST DATABASE ─────────────────────────────────────────────────────────
  pricegrid-db-test:
    image: postgres:15-alpine
    container_name: pricegrid-db-test
    profiles: [test]
    environment:
      POSTGRES_USER: pricegrid
      POSTGRES_PASSWORD: pricegrid
      POSTGRES_DB: pricegrid_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral — wiped on every restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricegrid -d pricegrid_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pricegrid-net

  # ── REDIS ─────────────────────────────────────────────────────────────────
  pricegrid-cache:
    image: redis:7-alpine
    container_name: pricegrid-cache
    restart: unless-stopped
    ports:
      - "6379:6379"             # exposed for local Redis tools (RedisInsight)
    volumes:
      - pricegrid-cache-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pricegrid-net

  # ── MIGRATIONS ────────────────────────────────────────────────────────────
  pricegrid-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: pricegrid-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pricegrid:pricegrid@pricegrid-db:5432/pricegrid
    depends_on:
      pricegrid-db:
        condition: service_healthy
    command: alembic upgrade head
    restart: on-failure
    networks:
      - pricegrid-net

# ── VOLUMES ───────────────────────────────────────────────────────────────
volumes:
  pricegrid-db-data:
    driver: local
  pricegrid-cache-data:
    driver: local

# ── NETWORKS ──────────────────────────────────────────────────────────────
networks:
  pricegrid-net:
    driver: bridge